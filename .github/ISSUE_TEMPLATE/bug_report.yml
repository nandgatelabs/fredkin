name: Bug report
description: Something is broken or behaves incorrectly
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Use **synthetic** sample data — do not paste real ledgers or backups.
        For security issues, email gshivamrut@gmail.com instead (see SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps others can follow
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS / device / app version (or “docs-only / N/A”)
      placeholder: Android 14 · Expo Go · commit abc1234
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Screenshots, logs (redacted), related PRs
    validations:
      required: false
